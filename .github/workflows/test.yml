name: Tests

on:
  push:
    paths:
      - 'cstr.c'
      - 'cstr.h'
      - 'test_cstr.c'
      - 'bench_cstr.c'
      - 'Makefile'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'cstr.c'
      - 'cstr.h'
      - 'test_cstr.c'
      - 'bench_cstr.c'
      - 'Makefile'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            cc: gcc
          - os: ubuntu-26.04
            cc: clang
          - os: macos-15
            cc: clang
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compiler information
        run: |
          uname -a
          "$CC" --version
        env:
          CC: ${{ matrix.cc }}
      - name: Unit tests
        run: make test CC="$CC"
        env:
          CC: ${{ matrix.cc }}
      - name: Address and undefined behavior sanitizers
        run: make test-asan CC="$CC"
        env:
          CC: ${{ matrix.cc }}
      - name: CMake build and tests
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$CC"
          cmake --build build/ci --parallel 2
          ctest --test-dir build/ci --output-on-failure
        env:
          CC: ${{ matrix.cc }}

  freebsd:
    name: FreeBSD 14.1 / GCC and Clang
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          run: |
            set -eu
            uname -a
            pkg install -y gmake gcc cmake
            gcc --version
            gmake test CC=gcc
            cc --version
            cmake -S . -B build/freebsd -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cc
            cmake --build build/freebsd --parallel 2
            ctest --test-dir build/freebsd --output-on-failure

  openbsd:
    name: OpenBSD 7.9 / Clang
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          run: |
            set -eu
            uname -a
            pkg_add gmake cmake
            cc --version
            gmake test CC=cc
            cmake -S . -B build/openbsd -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cc
            cmake --build build/openbsd --parallel 2
            ctest --test-dir build/openbsd --output-on-failure

  msvc:
    name: Windows / MSVC / ${{ matrix.config }} / shared=${{ matrix.shared }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build library, tests, and benchmark
        run: cmake --build build/msvc --config ${{ matrix.config }} --parallel 2
      - name: Unit tests
        run: ctest --test-dir build/msvc -C ${{ matrix.config }} --output-on-failure
